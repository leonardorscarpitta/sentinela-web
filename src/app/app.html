<a class="skip" href="#conteudo">Pular para o conteúdo</a>
<header>
  <div class="bar">
    <a routerLink="/" class="brand">
      <img src="logo.svg" alt="" width="32" height="32" />
      <span>Sentinela <strong>Cidadã</strong></span>
    </a>
    <nav aria-label="Principal">
      <a routerLink="/" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: true }"><app-icon name="home" /> Painel</a>
      <a routerLink="/varreduras" routerLinkActive="on"><app-icon name="list" /> Varreduras</a>
      <a routerLink="/regras" routerLinkActive="on"><app-icon name="rules" /> Regras PII</a>
    </nav>
    <button class="btn btn-ghost btn-sm theme" (click)="toggleTheme()"
      [attr.aria-label]="theme() === 'dark' ? 'Usar tema claro' : 'Usar tema escuro'">
      <app-icon [name]="theme() === 'dark' ? 'sun' : 'moon'" />
    </button>
  </div>
  <p class="demo">Demonstração com dados simulados · nenhum dado pessoal real</p>
</header>
<main id="conteudo">
  <router-outlet />
</main>
